<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Transmutation Calculator</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <!-- DataTables ColReorder CSS for column resizing -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/colreorder/1.5.4/css/colReorder.dataTables.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

</head>
<body>
    <div class="container-fluid">
        <h1>
            WoW Transmutation Calculator
            <button id="auth-status" class="btn btn-sm btn-secondary ml-3">Checking token...</button>
            <!-- Button to refresh the database -->
            <button id="refresh-database" class="btn btn-sm btn-primary ml-3">Refresh Database</button>
        </h1>
        <!-- Last Updated Span -->
        <span class="ml-3 last-updated">DB Last Updated: N/A</span>

        <!-- Card for AH Price List -->
        <div class="card">
            <h2>Current AH Price List</h2>

            <!-- Row for Price Type, Toggle Materials, and Toggle Tiers -->
            <div class="row">
                <!-- Left column: Price Type, Toggle Tiers, and Transmutation Options -->
                <div class="col-md-6">
                    <!-- Price Type -->
                    <div class="card mb-2">
                        <div class="card-body">
                            <h3>Price Type:</h3>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="priceType" id="market_value" value="market_value" checked>
                                <label class="form-check-label" for="market_value">Market Value</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="priceType" id="min_unit_price" value="min_unit_price">
                                <label class="form-check-label" for="min_unit_price">Min Unit Price</label>
                            </div>
                            <!-- Reset All Prices Button --> 
                            <button id="reset-all-prices" class="btn btn-outline-secondary btn-sm">Reset All Prices</button>
                        </div>
                    </div>

                    <!-- Nested Row for Toggle Tiers and Transmutation Options -->
                    <div class="row">
                        <!-- Toggle Tiers -->
                        <div class="col-md-6">
                            <div class="card mb-2">
                                <div class="card-body">
                                    <h3>Toggle Tiers:</h3>
                                    <button class="toggle-row btn btn-outline-primary btn-sm active" data-tier="T1" aria-pressed="true">Toggle T1</button>
                                    <button class="toggle-row btn btn-outline-primary btn-sm active" data-tier="T2" aria-pressed="true">Toggle T2</button>
                                    <button class="toggle-row btn btn-outline-primary btn-sm active" data-tier="T3" aria-pressed="true">Toggle T3</button>
                                </div>
                            </div>
                        </div>

                        <!-- Transmutation Options -->
                        <div class="col-md-6">
                            <div class="card mb-2">
                                <div class="card-body">
                                    <h3>Transmutation Options:</h3>
                                    <button id="toggle-t1-t2-transmutation" class="btn btn-outline-primary btn-sm active" aria-pressed="true">T1 -> T2</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right column: Toggle Materials and Transmutagen Groups -->
                <div class="col-md-6">
                    <!-- Toggle Materials -->
                    <div class="card">
                        <div class="card-body">
                            <h3>Toggle Materials:</h3>
                            <!-- Reset Button -->
                            <button id="reset-materials" class="btn btn-outline-secondary btn-sm">Reset</button>
                            <!-- Material Buttons Container -->
                            <div id="material-buttons">
                                <!-- Material buttons will be dynamically inserted here -->
                            </div>
                        </div>
                    </div>

                    <!-- Transmutagen Groups -->
                    <div class="card mb-3">
                        <div class="card-body">
                            <h3>Transmutagen Groups:</h3>
                            <button class="toggle-group btn btn-outline-secondary btn-sm" data-group="Mercurial">Mercurial Transmutagen</button>
                            <button class="toggle-group btn btn-outline-secondary btn-sm" data-group="Ominous">Ominous Transmutagen</button>
                            <button class="toggle-group btn btn-outline-secondary btn-sm" data-group="Volatile">Volatile Transmutagen</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table for commodities -->
            <div class="table-responsive">
                <table id="price-table" class="display table table-striped table-bordered">
                    <thead>
                        <tr id="price-table-header">
                            <!-- Table headers will be dynamically inserted here -->
                        </tr>
                    </thead>
                    <tbody id="price-table-body">
                        <!-- Table body will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>

        </div>

        <!-- Card for Transmutation Profit -->
        <div class="card mt-3">
            <h2>Transmutation Profit</h2>

            <!-- Table for transmutation profit -->
            <div class="table-responsive">
                <table id="transmutation-profit-table" class="display table table-striped table-bordered">
                    <thead>
                        <tr id="profit-table-header">
                            <!-- Table headers will be dynamically inserted here -->
                        </tr>
                    </thead>
                    <tbody id="transmutations-table-body">
                        <!-- Table body will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>        
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>
    <!-- DataTables ColReorder JS -->
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/colreorder/1.5.4/js/dataTables.colReorder.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/table.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
